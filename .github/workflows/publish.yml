name: publish

# Publishing a GitHub release uploads that version to PyPI as unsaid-video.
# PyPI trusts this workflow directly (trusted publishing), so there is no API
# token to store: PyPI's publisher settings name this repository, this file
# (publish.yml) and the `pypi` environment below.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - name: Test the built wheel, not the checkout
        run: |
          uv venv /tmp/check
          uv pip install --python /tmp/check/bin/python "$(ls dist/*.whl)" pytest
          rm -rf src
          /tmp/check/bin/python -m pytest
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
